    </g>
  </defs>
  <g fill="none" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" opacity="0.09">
    <use href="#floppy" x="30" y="30" stroke="#e8a0b4"/>
    <use href="#terminal" x="150" y="30" stroke="#9cb98a"/>
    <use href="#sparkle" x="90" y="90" stroke="#e3b04b"/>
    <use href="#cassette" x="210" y="90" stroke="#cfa8e0"/>
    <use href="#braces" x="30" y="150" stroke="#9cc3d5"/>
    <use href="#monitor" x="150" y="150" stroke="#e8836b"/>
    <use href="#cursor" x="90" y="210" stroke="#f1e6dc"/>
