      <rect x="-5" y="-9" width="9" height="6"/>
      <rect x="-6" y="2" width="12" height="7"/>
    </g>
    <path id="cursor" d="M-5 -9 V7 L-1 3 L2 9 L4.5 8 L1.5 2 H7 Z"/>
    <g id="terminal">
      <rect x="-10" y="-8" width="20" height="16" rx="2"/>
      <path d="M-6 -3 L-3 0 L-6 3 M-1 3 H4"/>
    </g>
    <g id="braces">
      <path d="M-4 -8 Q-7 -8 -7 -5 V-2 Q-7 0 -9 0 Q-7 0 -7 2 V5 Q-7 8 -4 8"/>
      <path d="M4 -8 Q7 -8 7 -5 V-2 Q7 0 9 0 Q7 0 7 2 V5 Q7 8 4 8"/>
    </g>
    <path id="sparkle" d="M0 -9 L2 -2 L9 0 L2 2 L0 9 L-2 2 L-9 0 L-2 -2 Z"/>
